<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Projetos Python do Eduardo — Banner em português</title>
  <desc>Banner em português apresentando uma coleção de mini-projetos Python: jogos, ferramentas e utilitários, desenvolvidos por Eduardo Souza Rodrigues.</desc>
  <defs>
    <style>
      .title { font-family: ui-monospace,'Cascadia Code',monospace; font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 13px; fill: #94a3b8; }
      .tag-text { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 11px; font-weight: 600; }
      .badge-label { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 11px; font-weight: 500; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" fill="#0f172a" rx="12"/>

  <!-- Left accent bar — green (Brazilian flag nod) -->
  <rect x="0" y="0" width="4" height="200" fill="#22c55e" rx="2"/>

  <!-- Subtle grid lines -->
  <line x1="40" y1="0" x2="40" y2="200" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="340" y1="0" x2="340" y2="200" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Python logo badge — green tones -->
  <circle cx="52" cy="50" r="18" fill="#14532d" opacity="0.6"/>
  <circle cx="52" cy="50" r="12" fill="#22c55e" opacity="0.9"/>
  <text x="52" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#052e16">Py</text>

  <!-- Main title -->
  <text x="80" y="44" class="title">Projetos de Eduardo</text>
  <text x="80" y="74" font-family="ui-monospace,'Cascadia Code',monospace" font-size="28" font-weight="700" fill="#22c55e">Python</text>

  <!-- Subtitle -->
  <text x="80" y="100" class="subtitle">Uma coleção de coisas feitas com Python</text>

  <!-- Divider -->
  <line x1="24" y1="116" x2="656" y2="116" stroke="#1e293b" stroke-width="1"/>

  <!-- Tags: Jogos -->
  <rect x="24" y="130" width="52" height="22" rx="11" fill="#14532d"/>
  <text x="50" y="145" text-anchor="middle" class="tag-text" fill="#4ade80">🕹 Jogos</text>

  <rect x="84" y="130" width="68" height="22" rx="11" fill="#1a2e1a"/>
  <text x="118" y="145" text-anchor="middle" class="tag-text" fill="#86efac">Flappy Bird</text>

  <rect x="160" y="130" width="52" height="22" rx="11" fill="#1a2e1a"/>
  <text x="186" y="145" text-anchor="middle" class="tag-text" fill="#86efac">Cobrinha</text>

  <rect x="220" y="130" width="40" height="22" rx="11" fill="#1a2e1a"/>
  <text x="240" y="145" text-anchor="middle" class="tag-text" fill="#86efac">Pong</text>

  <rect x="268" y="130" width="66" height="22" rx="11" fill="#1a2e1a"/>
  <text x="301" y="145" text-anchor="middle" class="tag-text" fill="#86efac">Jogo da Velha</text>

  <!-- Tags: Ferramentas -->
  <rect x="24" y="160" width="88" height="22" rx="11" fill="#1a3a2e"/>
  <text x="68" y="175" text-anchor="middle" class="tag-text" fill="#34d399">🔧 Ferramentas</text>

  <rect x="120" y="160" width="68" height="22" rx="11" fill="#0d2b20"/>
  <text x="154" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Gerador QR</text>

  <rect x="196" y="160" width="78" height="22" rx="11" fill="#0d2b20"/>
  <text x="235" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Gen. de Senhas</text>

  <rect x="282" y="160" width="72" height="22" rx="11" fill="#0d2b20"/>
  <text x="318" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Calculadora</text>

  <rect x="362" y="160" width="62" height="22" rx="11" fill="#0d2b20"/>
  <text x="393" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Navegador</text>

  <!-- Right side: stat badges -->
  <rect x="470" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="514" y="54" text-anchor="middle" class="badge-label">🐍 Python 3</text>

  <rect x="566" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="610" y="54" text-anchor="middle" class="badge-label">📦 10 projetos</text>

  <rect x="470" y="72" width="184" height="30" rx="6" fill="#1e293b"/>
  <text x="562" y="92" text-anchor="middle" class="badge-label">⚡ Tkinter · Pygame · stdlib</text>

  <!-- Author bottom right -->
  <text x="656" y="185" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">por Eduardo Souza Rodrigues · v1.0.0</text>
</svg>
