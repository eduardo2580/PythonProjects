<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Proyectos Python de Eduardo — Banner en español</title>
  <desc>Banner en español que presenta una colección de mini-proyectos Python: juegos, herramientas y utilidades, desarrollados por Eduardo Souza Rodrigues.</desc>
  <defs>
    <style>
      .title { font-family: ui-monospace,'Cascadia Code',monospace; font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 13px; fill: #94a3b8; }
      .tag-text { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 11px; font-weight: 600; }
      .badge-label { font-family: ui-sans-serif,system-ui,sans-serif; font-size: 11px; font-weight: 500; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background: dark with a warm amber/red Spanish-flag-inspired accent -->
  <rect width="680" height="200" fill="#0f172a" rx="12"/>

  <!-- Left accent bar — amber/gold -->
  <rect x="0" y="0" width="4" height="200" fill="#f59e0b" rx="2"/>

  <!-- Subtle grid lines -->
  <line x1="40" y1="0" x2="40" y2="200" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="340" y1="0" x2="340" y2="200" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Python logo badge -->
  <circle cx="52" cy="50" r="18" fill="#78350f" opacity="0.6"/>
  <circle cx="52" cy="50" r="12" fill="#f59e0b" opacity="0.9"/>
  <text x="52" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#1c1917">Py</text>

  <!-- Main title -->
  <text x="80" y="44" class="title">Proyectos de Eduardo</text>
  <text x="80" y="74" font-family="ui-monospace,'Cascadia Code',monospace" font-size="28" font-weight="700" fill="#f59e0b">Python</text>

  <!-- Subtitle -->
  <text x="80" y="100" class="subtitle">Colección de cosas construidos con Python</text>

  <!-- Divider -->
  <line x1="24" y1="116" x2="656" y2="116" stroke="#1e293b" stroke-width="1"/>

  <!-- Tags: Juegos -->
  <rect x="24" y="130" width="64" height="22" rx="11" fill="#451a03"/>
  <text x="56" y="145" text-anchor="middle" class="tag-text" fill="#fbbf24">🕹 Juegos</text>

  <rect x="96" y="130" width="68" height="22" rx="11" fill="#292524"/>
  <text x="130" y="145" text-anchor="middle" class="tag-text" fill="#fcd34d">Flappy Bird</text>

  <rect x="172" y="130" width="56" height="22" rx="11" fill="#292524"/>
  <text x="200" y="145" text-anchor="middle" class="tag-text" fill="#fcd34d">Serpiente</text>

  <rect x="236" y="130" width="40" height="22" rx="11" fill="#292524"/>
  <text x="256" y="145" text-anchor="middle" class="tag-text" fill="#fcd34d">Pong</text>

  <rect x="284" y="130" width="62" height="22" rx="11" fill="#292524"/>
  <text x="315" y="145" text-anchor="middle" class="tag-text" fill="#fcd34d">Tres en raya</text>

  <!-- Tags: Herramientas -->
  <rect x="24" y="160" width="100" height="22" rx="11" fill="#1a3a2e"/>
  <text x="74" y="175" text-anchor="middle" class="tag-text" fill="#34d399">🔧 Herramientas</text>

  <rect x="132" y="160" width="74" height="22" rx="11" fill="#0d2b20"/>
  <text x="169" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Gen. QR</text>

  <rect x="214" y="160" width="90" height="22" rx="11" fill="#0d2b20"/>
  <text x="259" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Gen. contraseñas</text>

  <rect x="312" y="160" width="72" height="22" rx="11" fill="#0d2b20"/>
  <text x="348" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Calculadora</text>

  <rect x="392" y="160" width="64" height="22" rx="11" fill="#0d2b20"/>
  <text x="424" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Navegador</text>

  <!-- Right side: stat badges -->
  <rect x="470" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="514" y="54" text-anchor="middle" class="badge-label">🐍 Python 3</text>

  <rect x="566" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="610" y="54" text-anchor="middle" class="badge-label">📦 10 proyectos</text>

  <rect x="470" y="72" width="184" height="30" rx="6" fill="#1e293b"/>
  <text x="562" y="92" text-anchor="middle" class="badge-label">⚡ Tkinter · Pygame · stdlib</text>

  <!-- Author bottom right -->
  <text x="656" y="185" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">por Eduardo Souza Rodrigues · v1.0.0</text>
</svg>
