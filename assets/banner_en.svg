<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Eduardo's Python Projects — English banner</title>
  <desc>A banner introducing a collection of Python mini-projects including games, tools, and utilities built by Eduardo Souza Rodrigues.</desc>
  <defs>
    <style>
      .bg { fill: #1a1a2e; }
      .accent { fill: #3b82f6; }
      .accent2 { fill: #06b6d4; }
      .accent3 { fill: #8b5cf6; }
      .pill { rx: 12; ry: 12; }
      .title { font-family: ui-monospace, 'Cascadia Code', monospace; font-size: 28px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-monospace, 'Cascadia Code', monospace; font-size: 13px; fill: #94a3b8; }
      .tag-text { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .snake { font-family: ui-monospace, monospace; font-size: 11px; fill: #475569; }
      .badge-label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: #e2e8f0; }
      .dot { fill: #334155; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="680" height="200" fill="#0f172a" rx="12"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="200" fill="#3b82f6" rx="2"/>

  <!-- Subtle grid lines -->
  <line x1="40" y1="0" x2="40" y2="200" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="0" y1="100" x2="680" y2="100" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="340" y1="0" x2="340" y2="200" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Python logo shape (simplified snake-circle) -->
  <circle cx="52" cy="50" r="18" fill="#1e40af" opacity="0.5"/>
  <circle cx="52" cy="50" r="12" fill="#3b82f6" opacity="0.8"/>
  <text x="52" y="55" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#f8fafc">Py</text>

  <!-- Main title -->
  <text x="80" y="44" class="title">Eduardo's Python</text>
  <text x="80" y="74" font-family="ui-monospace,'Cascadia Code',monospace" font-size="28" font-weight="700" fill="#3b82f6">Projects</text>

  <!-- Subtitle -->
  <text x="80" y="100" class="subtitle">A curated collection of games, tools &amp; utilities — built with Python</text>

  <!-- Divider -->
  <line x1="24" y1="116" x2="656" y2="116" stroke="#1e293b" stroke-width="1"/>

  <!-- Tags row: Games -->
  <rect x="24" y="130" width="66" height="22" rx="11" fill="#1e3a5f"/>
  <text x="57" y="145" text-anchor="middle" class="tag-text" fill="#60a5fa">🕹 Games</text>

  <rect x="98" y="130" width="68" height="22" rx="11" fill="#1a2744"/>
  <text x="132" y="145" text-anchor="middle" class="tag-text" fill="#93c5fd">Flappy Bird</text>

  <rect x="174" y="130" width="48" height="22" rx="11" fill="#1a2744"/>
  <text x="198" y="145" text-anchor="middle" class="tag-text" fill="#93c5fd">Snake</text>

  <rect x="230" y="130" width="40" height="22" rx="11" fill="#1a2744"/>
  <text x="250" y="145" text-anchor="middle" class="tag-text" fill="#93c5fd">Pong</text>

  <rect x="278" y="130" width="62" height="22" rx="11" fill="#1a2744"/>
  <text x="309" y="145" text-anchor="middle" class="tag-text" fill="#93c5fd">TicTacToe</text>

  <!-- Tags row: Tools -->
  <rect x="24" y="160" width="50" height="22" rx="11" fill="#1a3a2e"/>
  <text x="49" y="175" text-anchor="middle" class="tag-text" fill="#34d399">🔧 Tools</text>

  <rect x="82" y="160" width="74" height="22" rx="11" fill="#0d2b20"/>
  <text x="119" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">QR Generator</text>

  <rect x="164" y="160" width="90" height="22" rx="11" fill="#0d2b20"/>
  <text x="209" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Pass Generator</text>

  <rect x="262" y="160" width="62" height="22" rx="11" fill="#0d2b20"/>
  <text x="293" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Calculator</text>

  <rect x="332" y="160" width="58" height="22" rx="11" fill="#0d2b20"/>
  <text x="361" y="175" text-anchor="middle" class="tag-text" fill="#6ee7b7">Browser</text>

  <!-- Right side: stats/badges -->
  <rect x="470" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="514" y="54" text-anchor="middle" class="badge-label">🐍 Python 3</text>

  <rect x="566" y="34" width="88" height="30" rx="6" fill="#1e293b"/>
  <text x="610" y="54" text-anchor="middle" class="badge-label">📦 10 projects</text>

  <rect x="470" y="72" width="184" height="30" rx="6" fill="#1e293b"/>
  <text x="562" y="92" text-anchor="middle" class="badge-label">⚡ Tkinter · Pygame · stdlib</text>

  <!-- Author tag bottom right -->
  <text x="656" y="185" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">by Eduardo Souza Rodrigues · v1.0.0</text>
</svg>
